# Publishes prototypes/ (the Piper and Hunter mockups) to GitHub Pages on every push to main.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["prototypes/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: touch prototypes/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes
      - id: deployment
        uses: actions/deploy-pages@v4
